<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241B15" />
      <stop offset="100%" stop-color="#121212" />
    </radialGradient>
  </defs>
  <!-- Background Circle with Safe Zone padding for maskable -->
  <rect width="512" height="512" rx="128" fill="#121212"/>
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)" stroke="url(#goldGradient)" stroke-width="8"/>
  
  <!-- Outer Gold Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFB800" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Pizza Slice / Crust & Chef Icon Graphic in Safe Area -->
  <g transform="translate(256, 256) scale(1.1) translate(-256, -256)">
    <!-- Pizza Slice base -->
    <path d="M 256,120 L 360,330 A 130,130 0 0,1 152,330 Z" fill="#FFB800" stroke="#FF6B00" stroke-width="6"/>
    <!-- Crust -->
    <path d="M 152,330 A 130,130 0 0,0 360,330" fill="none" stroke="#E65100" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Melted Cheese Layer -->
    <path d="M 256,145 L 340,320 A 110,110 0 0,1 172,320 Z" fill="#FFE082"/>
    
    <!-- Pepperonis -->
    <circle cx="256" cy="220" r="18" fill="#D32F2F"/>
    <circle cx="225" cy="275" r="16" fill="#D32F2F"/>
    <circle cx="285" cy="280" r="16" fill="#D32F2F"/>
    
    <!-- Basil / Herb specks -->
    <ellipse cx="256" cy="260" rx="8" ry="4" fill="#2E7D32" transform="rotate(25 256 260)"/>
    <ellipse cx="235" cy="205" rx="6" ry="3" fill="#2E7D32" transform="rotate(-30 235 205)"/>

    <!-- Chef Toque Hat floating over Pizza -->
    <path d="M 220,110 C 200,90 200,60 225,50 C 235,30 277,30 287,50 C 312,60 312,90 292,110 Z" fill="#FFFFFF"/>
    <path d="M 216,110 L 296,110 L 292,122 L 220,122 Z" fill="#FF6B00"/>
  </g>

  <!-- Title Arc Subtext / Badge -->
  <text x="256" y="445" font-family="'Outfit', sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">CHEFINHO</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#FFB800" text-anchor="middle" letter-spacing="4">PIZZARIA ARTESANAL</text>
</svg>
